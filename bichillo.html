<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FFF6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C0610" media="(prefers-color-scheme: dark)">
<title>El bichillo</title>
<style>
:root{
  --bg:#FFF6F7; --surface:#FFFFFF; --ink:#3B0A15; --muted:#8C5662; --red:#C40F2F; --red-ink:#FFFFFF;
  --line:#F0CDD4; --screen:#120207; --pixel:#F4F7FF; --face:#FF4D6A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1C0610; --surface:#2A0B18; --ink:#FBEAEE; --muted:#C9909C; --red:#FF4766; --red-ink:#1C0610;
    --line:#4A1626; --screen:#000000; color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:1rem/1.45 var(--sans);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:40rem;margin:0 auto;display:flex;align-items:center;gap:.85rem;padding:.75rem 1rem .5rem}
.face{width:72px;flex:none;background:var(--screen);border-radius:12px;padding:6px}
.face canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges}
h1{font:400 1.45rem/1.1 var(--serif);margin:0}
.state{color:var(--muted);font-size:.875rem;margin:.1rem 0 0}
nav{max-width:40rem;margin:0 auto;display:flex;gap:.25rem;padding:0 1rem .6rem}
nav button{all:unset;cursor:pointer;padding:.4rem .8rem;border-radius:999px;font-size:.9375rem;color:var(--muted)}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
main{flex:1;overflow-y:auto;overscroll-behavior:contain}
.list{max-width:40rem;margin:0 auto;padding:1rem 1rem 1.5rem;display:flex;flex-direction:column;gap:.5rem}
.msg{max-width:82%;padding:.6rem .85rem;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ella{align-self:flex-end;background:var(--red);color:var(--red-ink);border-bottom-right-radius:6px}
.msg.bicho{align-self:flex-start;background:var(--screen);color:var(--pixel);border-bottom-left-radius:6px}
.msg img{display:block;max-width:100%;border-radius:10px;image-rendering:pixelated}
.msg.ella img{background:#000}
.time{font-size:.75rem;color:var(--muted);margin:.1rem .4rem .35rem}
.time.ella{align-self:flex-end}.time.bicho{align-self:flex-start}
.day{align-self:center;color:var(--muted);font-size:.8125rem;margin:.75rem 0 .25rem}
.empty{color:var(--muted);text-align:center;margin:3rem 1rem}
.grid{max-width:40rem;margin:0 auto;padding:1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
.grid figure{margin:0;background:#000;border-radius:12px;padding:6px}
.grid img{display:block;width:100%;image-rendering:pixelated}
.grid figcaption{color:#c9b6bb;font-size:.75rem;padding:.3rem .2rem 0}
footer{border-top:1px solid var(--line);background:var(--bg)}
.composer{max-width:40rem;margin:0 auto;display:flex;align-items:flex-end;gap:.5rem;padding:.6rem 1rem .75rem}
textarea{flex:1;min-width:0;resize:none;overflow-y:auto;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:20px;padding:.6rem .9rem;min-height:44px;max-height:8rem}
textarea:focus{outline:2px solid var(--red);outline-offset:1px;border-color:transparent}
.btn{flex:none;min-height:44px;padding:0 1rem;border-radius:22px;border:0;font:600 .9375rem var(--sans);cursor:pointer}
.btn.send{background:var(--red);color:var(--red-ink)}
.btn.draw{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.err{max-width:40rem;margin:0 auto;padding:0 1rem .5rem;color:var(--red);font-size:.875rem}
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);width:min(34rem,100vw);max-width:100vw;border-radius:20px}
dialog::backdrop{background:rgba(28,6,16,.55)}
.sheet{padding:1.1rem}
.sheet h2{font:400 1.3rem/1.2 var(--serif);margin:0 0 .75rem}
.canvaswrap{background:#000;border-radius:14px;padding:8px}
.canvaswrap canvas{display:block;width:100%;image-rendering:pixelated;touch-action:none;cursor:crosshair}
.tools{display:flex;flex-wrap:wrap;gap:.4rem;margin:.75rem 0 0}
.tools button{flex:1 1 auto;min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .9rem var(--sans);cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:.5rem;margin:1rem 0 0}
.row .btn{flex:1}
.locked{max-width:26rem;margin:4rem auto;padding:0 1.25rem;text-align:center}
.locked h1{margin-bottom:.5rem}
.locked p{color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="locked" id="locked" hidden>
  <h1>Este enlace no está completo</h1>
  <p>Para hablar con el bichillo hace falta el enlace con la clave. Pídeselo a quien te lo regaló.</p>
</div>

<header id="head">
  <div class="top">
    <div class="face" aria-hidden="true"><canvas id="face" width="64" height="32"></canvas></div>
    <div><h1>El bichillo</h1><p class="state" id="state">Le lleva tus mensajes</p></div>
  </div>
  <nav role="tablist" aria-label="Secciones">
    <button role="tab" aria-selected="true" data-tab="chat">Charla</button>
    <button role="tab" aria-selected="false" data-tab="dibujos">Dibujos</button>
  </nav>
</header>

<main id="scroller">
  <section id="tab-chat"><div class="list" id="chat" aria-live="polite"></div></section>
  <section id="tab-dibujos" hidden><div class="grid" id="dibujos"></div></section>
</main>

<footer id="foot">
  <p class="err" id="err" role="alert" hidden></p>
  <div class="composer">
    <button class="btn draw" id="openDraw" type="button">Dibujar</button>
    <label for="text" hidden>Mensaje</label>
    <textarea id="text" rows="1" placeholder="Escribe aquí" enterkeyhint="send"></textarea>
    <button class="btn send" id="send" type="button" disabled>Enviar</button>
  </div>
</footer>

<dialog id="drawDlg" aria-labelledby="drawTitle">
  <div class="sheet">
    <h2 id="drawTitle">Un dibujo para él</h2>
    <div class="canvaswrap"><canvas id="pad" width="128" height="64" aria-label="Lienzo"></canvas></div>
    <div class="tools" role="toolbar" aria-label="Herramientas">
      <button type="button" data-tool="fino" aria-pressed="true">Fino</button>
      <button type="button" data-tool="gordo" aria-pressed="false">Gordo</button>
      <button type="button" data-tool="goma" aria-pressed="false">Goma</button>
      <button type="button" id="undo">Deshacer</button>
      <button type="button" id="wipe">Borrar todo</button>
    </div>
    <div class="row">
      <button class="btn draw" type="button" id="closeDraw">Cancelar</button>
      <button class="btn send" type="button" id="sendDraw">Enviar dibujo</button>
    </div>
  </div>
</dialog>

<script>
// ===== Dirección de tu Worker de Cloudflare (cámbiala por la tuya) =====
const WORKER = 'https://bichillo-chat.7tbcc2mby4.workers.dev/';

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- clave: llega en el enlace (#k=...) y se guarda ----------
let KEY = '';
try {
  const m = location.hash.match(/k=([^&]+)/);
  if (m) { localStorage.setItem('bichillo_key', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); }
  KEY = localStorage.getItem('bichillo_key') || '';
} catch (e) {}
if (!KEY) { $('locked').hidden = false; $('head').hidden = $('scroller').hidden = $('foot').hidden = true; }

async function api(path, body) {
  const r = await fetch(WORKER + path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Key': KEY }, body: JSON.stringify(body) });
  if (r.status === 401) throw new Error('key');
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) throw new Error('http');
  return j;
}

// Lo que ella ha enviado se guarda en su propio móvil
let log = [];
try { log = JSON.parse(localStorage.getItem('bichillo_log') || '[]'); } catch (e) {}
function save() { try { localStorage.setItem('bichillo_log', JSON.stringify(log.slice(-500))); } catch (e) {} }

// ---------- la carita en píxeles ----------
const fc = $('face'), fx = fc.getContext('2d');
const HEART = ['0110110','1111111','1111111','0111110','0011100','0001000'];
let mood = 'normal', moodUntil = 0, blinkAt = Date.now() + 1800, look = 0;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function eye(x, y, w, h) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (!((i === 0 || i === w - 1) && (j === 0 || j === h - 1) && h > 2)) fx.fillRect(x + i, y + j, 1, 1); }
function heart(x, y, s) { for (let j = 0; j < 6; j++) for (let i = 0; i < 7; i++) if (HEART[j][i] === '1') fx.fillRect(x + i * s, y + j * s, s, s); }
function setMood(m, ms) { mood = m; moodUntil = Date.now() + ms; }
function drawFace() {
  const now = Date.now();
  if (moodUntil && now > moodUntil) { mood = 'normal'; moodUntil = 0; }
  fx.fillStyle = css('--screen'); fx.fillRect(0, 0, 64, 32);
  fx.fillStyle = css('--face');
  let h = 14, dx = look;
  if (mood === 'busy') dx = Math.round(Math.sin(now / 200) * 5);
  if (!reduce && now > blinkAt && now < blinkAt + 140) h = 2;
  if (now > blinkAt + 140) { blinkAt = now + 2500 + Math.random() * 3500; if (!reduce) look = [0, 0, -3, 3, 0][Math.floor(Math.random() * 5)]; }
  if (mood === 'love') { heart(12 + dx, 10, 2); heart(38 + dx, 10, 2); }
  else { eye(13 + dx, 9 + (14 - h) / 2, 12, h); eye(39 + dx, 9 + (14 - h) / 2, 12, h); }
  requestAnimationFrame(drawFace);
}
requestAnimationFrame(drawFace);

// ---------- pestañas ----------
let tab = 'chat';
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', x === b));
  ['chat', 'dibujos'].forEach(t => $('tab-' + t).hidden = t !== tab);
  $('foot').hidden = tab !== 'chat';
  if (tab === 'chat') scrollEnd();
});

// ---------- historial ----------
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hhmm = ts => new Date(ts).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
const dayOf = ts => new Date(ts).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
function scrollEnd() { const s = $('scroller'); s.scrollTop = s.scrollHeight; }

function render() {
  let html = `<div class="msg bicho">Hola. Lo que me escribas o dibujes se lo llevo a él.</div>`, day = '';
  for (const m of log) {
    const d = dayOf(m.ts);
    if (d !== day) { html += `<div class="day">${d}</div>`; day = d; }
    const body = m.kind === 'drawing' ? `<img src="${m.data}" alt="Tu dibujo">` : esc(m.text);
    html += `<div class="msg ella">${body}</div><div class="time ella">${hhmm(m.ts)}</div>`;
  }
  $('chat').innerHTML = html;
  const ds = log.filter(m => m.kind === 'drawing').reverse();
  $('dibujos').innerHTML = ds.length ? ds.map(m => `<figure><img src="${m.data}" alt="Dibujo"><figcaption>${dayOf(m.ts)}, ${hhmm(m.ts)}</figcaption></figure>`).join('')
    : `<p class="empty" style="grid-column:1/-1">Aquí se guardan los dibujos que le mandes. Pulsa «Dibujar» en la charla.</p>`;
  scrollEnd();
}
function showErr(t) { $('err').textContent = t; $('err').hidden = !t; }

// ---------- enviar texto ----------
const ta = $('text');
ta.addEventListener('input', () => { $('send').disabled = !ta.value.trim(); ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 128) + 'px'; });
ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); $('send').click(); } });
$('send').onclick = async () => {
  const t = ta.value.trim(); if (!t) return;
  $('send').disabled = true; setMood('busy', 1500); $('state').textContent = 'Llevándoselo…';
  try {
    await api('/api/send', { text: t });
    log.push({ ts: Date.now(), kind: 'text', text: t }); save();
    ta.value = ''; ta.style.height = 'auto'; render(); showErr('');
    setMood('love', 2500); $('state').textContent = 'Se lo he llevado';
  } catch (e) {
    showErr(e.message === 'key' ? 'La clave del enlace no es correcta.' : 'No he podido enviarlo. Revisa la conexión y vuelve a intentarlo.');
    $('send').disabled = false; $('state').textContent = 'Le lleva tus mensajes';
  }
  setTimeout(() => $('state').textContent = 'Le lleva tus mensajes', 4000);
};

// ---------- dibujar ----------
const W = 128, H = 64, pad = $('pad'), px = pad.getContext('2d');
let dots = new Uint8Array(W * H), tool = 'fino', drawing = false, last = null, hist = [];
function paint() { const img = px.createImageData(W, H); for (let i = 0; i < W * H; i++) { const v = dots[i] ? 245 : 0, o = i * 4; img.data[o] = v; img.data[o + 1] = dots[i] ? 248 : 0; img.data[o + 2] = dots[i] ? 255 : 0; img.data[o + 3] = 255; } px.putImageData(img, 0, 0); }
function plot(x, y) { const r = tool === 'fino' ? 0 : tool === 'gordo' ? 1 : 2, on = tool === 'goma' ? 0 : 1;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { if (r > 1 && dx * dx + dy * dy > r * r + 1) continue; const X = x + dx, Y = y + dy; if (X >= 0 && X < W && Y >= 0 && Y < H) dots[Y * W + X] = on; } }
function line(a, b) { let x0 = a.x, y0 = a.y; const x1 = b.x, y1 = b.y, dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1; let err = dx + dy;
  for (;;) { plot(x0, y0); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } } }
const pos = e => { const r = pad.getBoundingClientRect(); return { x: Math.floor((e.clientX - r.left) / r.width * W), y: Math.floor((e.clientY - r.top) / r.height * H) }; };
pad.addEventListener('pointerdown', e => { e.preventDefault(); pad.setPointerCapture(e.pointerId); hist.push(dots.slice()); if (hist.length > 30) hist.shift(); drawing = true; last = pos(e); line(last, last); paint(); });
pad.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); line(last, p); last = p; paint(); });
['pointerup', 'pointercancel'].forEach(t => pad.addEventListener(t, () => drawing = false));
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => { tool = b.dataset.tool; document.querySelectorAll('[data-tool]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
$('undo').onclick = () => { if (hist.length) { dots = hist.pop(); paint(); } };
$('wipe').onclick = () => { hist.push(dots.slice()); dots = new Uint8Array(W * H); paint(); };
$('openDraw').onclick = () => { $('drawDlg').showModal(); paint(); };
$('closeDraw').onclick = () => $('drawDlg').close();
function exportPNG(scale) {
  const c = document.createElement('canvas'); c.width = W * scale; c.height = H * scale;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(pad, 0, 0, c.width, c.height);
  return c.toDataURL('image/png');
}
$('sendDraw').onclick = async () => {
  if (!dots.some(v => v)) return;
  $('sendDraw').disabled = true; $('sendDraw').textContent = 'Enviando…';
  const small = exportPNG(1), big = exportPNG(6);
  try {
    await api('/api/drawing', { big });
    log.push({ ts: Date.now(), kind: 'drawing', data: small }); save();
    dots = new Uint8Array(W * H); hist = []; $('drawDlg').close(); render(); showErr(''); setMood('love', 2500);
    $('state').textContent = 'Se lo he llevado'; setTimeout(() => $('state').textContent = 'Le lleva tus mensajes', 4000);
  } catch (e) { showErr('No he podido enviar el dibujo. Inténtalo otra vez.'); }
  $('sendDraw').disabled = false; $('sendDraw').textContent = 'Enviar dibujo';
};

if (KEY) render();
</script>
</body>
</html>
